<!doctype html>
<html lang="bn" dir="ltr">
<head>
<meta charset="utf-8">

<title>উস্তাদ নাজমুল হুদা নোমানী দা.বা. — ১৭টি দরস</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f7f5;--surface:#fff;--text:#17332e;--muted:#647873;--brand:#0f766e;--brand2:#115e59;--line:#dbe9e5;--shadow:0 14px 34px #0f766e14;--danger:#dc2626;--gold:#b7791f}
[data-theme=dark]{--bg:#10201e;--surface:#17302c;--text:#effcf8;--muted:#a6c0ba;--brand:#2dd4bf;--brand2:#5eead4;--line:#2c4a45;--shadow:0 14px 34px #0005}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,var(--bg),#dceee9);color:var(--text);font-family:'Hind Siliguri',sans-serif;min-height:100vh}.wrap{max-width:980px;margin:auto;padding:18px 14px 45px}.hero{background:linear-gradient(135deg,#064e3b,#0f766e 58%,#14b8a6);color:#fff;border-radius:24px;padding:28px 22px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:'حديث';font-family:'Noto Naskh Arabic';position:absolute;right:20px;bottom:-23px;font-size:120px;color:#fff1}.eyebrow{font-size:.85rem;opacity:.85;margin:0 0 4px}.hero h1{font-size:clamp(1.45rem,4vw,2.2rem);margin:0 0 5px;line-height:1.35}.hero p{margin:0;opacity:.9}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.search{flex:1;min-width:220px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:13px;padding:12px 14px;font:inherit;outline:none}.search:focus{border-color:var(--brand);box-shadow:0 0 0 3px #0f766e22}.tool{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:13px;padding:10px 13px;font:inherit;cursor:pointer}.tool:hover{border-color:var(--brand);color:var(--brand)}.stats{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:5px 2px 14px;color:var(--muted);font-size:.92rem}.bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--brand);width:0;transition:width .3s}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow);transition:.2s;display:flex;flex-direction:column;min-height:205px}.card:hover{transform:translateY(-2px)}.card.done{border-color:#34d399}.card-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.number{color:var(--brand);font-weight:700;font-size:1.05rem}.check{width:30px;height:30px;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--brand);cursor:pointer;font-size:1rem}.done .check{background:#10b981;color:#fff;border-color:#10b981}.topic{font-size:1.04rem;line-height:1.7;margin:11px 0 14px;font-weight:600;flex:1}.arabic{font-family:'Noto Naskh Arabic',serif;font-weight:600}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;text-decoration:none;border-radius:10px;padding:8px 10px;font-size:.84rem;font-weight:600;border:1px solid transparent}.yt{background:var(--danger);color:#fff}.download{background:#eff8f5;color:var(--brand2);border-color:#b9ded5}.disabled{opacity:.45;cursor:not-allowed;pointer-events:none}.hint{font-size:.76rem;color:var(--muted);margin-top:9px}.empty{display:none;text-align:center;background:var(--surface);border:1px dashed var(--line);padding:25px;border-radius:16px;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:.82rem;margin-top:28px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(90px);background:#17332e;color:#fff;padding:10px 16px;border-radius:10px;transition:.25s;z-index:4}.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<main class="wrap">
<section class="hero"><p class="eyebrow">রাহবার গবেষণা কেন্দ্র</p><h1>উস্তাদ নাজমুল হুদা নোমানী দা.বা.-এর দরস</h1><p>উসূলে হাদীস ও উসূলে জারহ-তা‘দীল — ১৭টি ভিডিও দরস</p></section>
<div class="toolbar"><input id="search" class="search" type="search" placeholder="দরসের বিষয় বা নম্বর লিখে খুঁজুন…" aria-label="দরস অনুসন্ধান"><button class="tool" id="theme" type="button">☾ ডার্ক মোড</button><button class="tool" id="share" type="button">↗ শেয়ার</button></div>
<div class="stats"><span id="count">১৭টির মধ্যে ০টি সম্পন্ন</span><div class="bar"><i id="progress"></i></div></div>
<section class="grid" id="lessons"></section><div class="empty" id="empty">কোনো দরস পাওয়া যায়নি। অন্য শব্দ দিয়ে চেষ্টা করুন।</div>
<footer>© ২০২৬ রাহবার গবেষণা কেন্দ্র · ভিডিও লিংক YouTube থেকে সংগৃহীত</footer>
</main><div class="toast" id="toast"></div>
<script>
const lessons=[
['১ম','উসূলে হাদীস: শাফেঈ ও হানাফী মাযহাবের পার্থক্য','https://www.youtube.com/live/644SaJkDfp4'],
['২য়','উসূলে হাদীসে হানাফী ও শাফেঈ মাযহাবের মূলনীতি','https://www.youtube.com/live/zb5VyMoqI4k'],
['৩য়','মুহাদ্দিসীন ও ফুকাহাগণের হাদীস মূল্যায়নের পার্থক্য','https://www.youtube.com/live/xwXc2CvqG_w'],
['৪র্থ','হাদীস গ্রহণে মুহাদ্দিসীন ও ফুকাহাদের শর্তাবলী','https://www.youtube.com/live/vP4XGydMtp4'],
['৫ম','خبر واحد (খবরে ওয়াহিদ) ও ফুকাহাদের অবস্থান','https://www.youtube.com/live/di-4HfTVdiw'],
['৬ষ্ঠ','الحديث المرسل (মুরসাল হাদীস) গ্রহণের দৃষ্টিভঙ্গি','https://www.youtube.com/live/KHa3nbam6lo'],
['৭ম','زیادة الثقة (যিয়াদাতু সিকা) ও এর হুকুম','https://www.youtube.com/live/_reiQ2kBFAM'],
['৮ম','الجرح والتعديل (জারহ ও তা‘দীল)-এর হানাফী মূলনীতি','https://www.youtube.com/live/7WkoOVrAt50'],
['৯ম','تعارض الأدلة (দলিলসমূহের বিরোধ নিরসন)','https://www.youtube.com/live/_TP_f7Xlde0'],
['১০ম','الحديث الضعيف (যঈফ হাদীস) ও ফুকাহাগণের আমল','https://www.youtube.com/live/2QBJJR4J5i8'],
['১১শ','القياس (কিয়াস) ও হাদীসের পারস্পরিক সম্পর্ক','https://www.youtube.com/live/98u8XvLsVg8'],
['১২শ','عمل أهل المدينة (আমলে আহলে মাদীনা) ও উসূলে ফিকহ','https://www.youtube.com/live/60GfHq8F2wY'],
['১৩শ','উসূলে হাদীস ও উসূলে জারহ তা‘দীল','https://www.youtube.com/live/f78C5yoy1qs?si=rQ2HV4vgaiDFFQT3','https://archive.org/details/dorse_numani-13','https://t.me/rahbar_to_truth/605','https://drive.google.com/file/d/1QephpWgCIl46VXmadeH-2j5sujnDFVaD/view?usp=sharing'],
['১৪শ','সহীহ হাদীসের সংজ্ঞা ও শর্তাবলী: ফকীহ ও মুহাদ্দিসগণের দৃষ্টিভঙ্গি','https://www.youtube.com/live/E0n3cw0UjQE?si=N212VP_6KqtKAUeG','','https://t.me/rahbar_to_truth/606','https://drive.google.com/file/d/1xkZkr12XE7B4r6nE6kEj1OvFoG_TQyDs/view?usp=sharing'],
['১৫শ','২০০ হিজরী পরবর্তী ইমাম শাফেঈ (রহ.) কর্তৃক সালাফদের উসূলে হাদীসের বিপরীত অবস্থান','https://www.youtube.com/live/0GZOjzgnWHg?si=srQsoNdRcI14fUlf','','https://t.me/rahbar_to_truth/608','https://drive.google.com/file/d/1PfNDTWZawo-A4apn3TMRZ8BFgHi8-deT/view?usp=sharing'],
['১৬শ','হানাফীদের আমলে মুতাওয়ারাসের পরিচয়','https://www.youtube.com/live/lgVj5ZNwuww?si=L1OHj7q75ElgsnKV','','https://t.me/rahbar_to_truth/609','https://drive.google.com/file/d/1gvQ0qLpOs8AKcyjeOvj4RmJ3dzmg4S_X/view?usp=sharing'],
['১৭শ','العمل المتوارث ও এতে মালেকিয়া ও হানাফিয়াদের মধ্যকার বৈচিত্র্য','https://www.youtube.com/live/oxxC_zD3QRU?si=OJmoNQndX0UigDtH','','https://t.me/rahbar_to_truth/610','https://drive.google.com/file/d/1c_b_v0qYgr4t5d031L1F855nt_dAJWMw/view?usp=sharing']
];
const key='rahbar-dars-done-v1';let done=JSON.parse(localStorage.getItem(key)||'[]');
const $=s=>document.querySelector(s), lessonsEl=$('#lessons');
function render(){const q=$('#search').value.trim().toLowerCase();lessonsEl.innerHTML='';let shown=0;lessons.forEach((x,i)=>{if(q&&!(`${x[0]} ${x[1]}`.toLowerCase().includes(q)))return;shown++;const is=done.includes(i);const c=document.createElement('article');c.className='card'+(is?' done':'');
const archiveUrl=x[3];
const telegramUrl=x[4];
const driveUrl=x[5];

const archiveBtn=archiveUrl?`<a class="btn download" href="${archiveUrl}" target="_blank" rel="noopener">⇩ Archive</a>`:`<span class="btn download disabled">⇩ Archive</span>`;
const telegramBtn=telegramUrl?`<a class="btn download" href="${telegramUrl}" target="_blank" rel="noopener">⇩ Telegram</a>`:`<span class="btn download disabled">⇩ Telegram</span>`;
const driveBtn=driveUrl?`<a class="btn download" href="${driveUrl}" target="_blank" rel="noopener">⇩ Drive</a>`:`<span class="btn download disabled">⇩ Drive</span>`;

const hasDownload=archiveUrl||telegramUrl||driveUrl;
const hintText=hasDownload?'সংযুক্ত লিংক থেকে দরস ডাউনলোড করুন':'ডাউনলোড লিংক যুক্ত হলে এই বাটনগুলো সক্রিয় হবে';

c.innerHTML=`<div class="card-head"><span class="number">${x[0]} দরস</span><button class="check" title="সম্পন্ন হিসেবে চিহ্নিত করুন" aria-label="সম্পন্ন">${is?'✓':'○'}</button></div><div class="topic">${x[1]}</div><div class="actions"><a class="btn yt" href="${x[2]}" target="_blank" rel="noopener">▶ YouTube</a>${archiveBtn}${telegramBtn}${driveBtn}</div><div class="hint">${hintText}</div>`;c.querySelector('.check').onclick=()=>{done=done.includes(i)?done.filter(n=>n!==i):[...done,i];localStorage.setItem(key,JSON.stringify(done));render();};lessonsEl.appendChild(c);});$('#empty').style.display=shown?'none':'block';$('#count').textContent=`১৭টির মধ্যে ${done.length}টি সম্পন্ন`;$('#progress').style.width=(done.length/17*100)+'%';}
$('#search').addEventListener('input',render);$('#theme').onclick=()=>{const dark=document.body.dataset.theme==='dark';document.body.dataset.theme=dark?'':'dark';$('#theme').textContent=dark?'☾ ডার্ক মোড':'☀ লাইট মোড';localStorage.setItem('rahbar-theme',dark?'light':'dark')};
if(localStorage.getItem('rahbar-theme')==='dark'){$('#theme').click()}
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2200)}
$('#share').onclick=async()=>{const d={title:document.title,text:'উস্তাদ নাজমুল হুদা নোমানী দা.বা.-এর ১৭টি দরস',url:location.href};try{if(navigator.share)await navigator.share(d);else{await navigator.clipboard.writeText(location.href);toast('লিংক কপি হয়েছে');}}catch(e){}};render();
</script></body></html>
