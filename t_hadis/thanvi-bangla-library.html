    <style>

        :root {

            color: var(--text-dark);
            overflow-x: hidden;
        }

        /* Header & Search */
        .header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
            position: relative;
        }
        .menu-btn {
            position: absolute; left: 20px; top: 25px;
            font-size: 24px; cursor: pointer; color: white; z-index: 100;
        }

        .search-box-container {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }
        .search-input {
            width: 100%;
            max-width: 500px;
            padding: 12px 20px;
            font-size: 16px;
            font-family: 'Hind Siliguri', sans-serif;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        .search-input::placeholder { color: rgba(255, 255, 255, 0.7); }
        .search-input:focus {
            background: rgba(255, 255, 255, 0.95);
            color: var(--text-dark);
            border-color: var(--accent-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* Sidebar */
        .sidebar {
            position: fixed; left: -300px; top: 0; width: 300px; height: 100%;
            background: white; box-shadow: 5px 0 15px rgba(0,0,0,0.1);
            transition: 0.3s ease; z-index: 1000; overflow-y: auto; padding: 20px;
        }
        .sidebar.active { left: 0; }
        .sidebar h2 { border-bottom: 2px solid var(--primary-color); margin-bottom: 15px; padding-bottom: 10px; font-size: 18px; }
        .sidebar-item { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 14px; }
        .sidebar-item:hover { background: #f3f4f6; color: var(--primary-color); }

        /* Grid & Cards */
        .container { max-width: 1400px; margin: 0 auto; padding: 30px 15px; }
        .grid-container {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 20px;
        }

        .book-card {
            position: relative; cursor: pointer; border-radius: 12px;
            overflow: hidden; 
            border: 1px solid #cbd5e1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: 0.4s; height: 360px; background: var(--primary-color);
        }
        .book-card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
            border-color: var(--primary-color); 
        }
        
        /* Dynamic Cover Wrapper */
        .book-cover-wrapper {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, var(--primary-color), #451a03);
            color: white; text-align: center; padding: 15px; font-weight: 600; font-size: 14px;
            position: relative;
        }
        .book-image { 
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; object-fit: cover; display: block; 
        }
        
        .book-actions {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(180deg, rgba(133, 77, 14, 0.95) 0%, rgba(113, 63, 18, 1) 100%);
            padding: 12px; transform: translateY(100%);
            transition: 0.4s ease; display: flex; flex-direction: column; gap: 6px;
            max-height: 100%; overflow-y: auto; z-index: 2;
        }
        .book-card.active .book-actions { transform: translateY(0); }

        .btn {
            border: none; padding: 7px; border-radius: 6px;
            cursor: pointer; font-size: 11px; font-weight: 700;
            width: 100%; display: flex; align-items: center; justify-content: center;
            gap: 5px; text-decoration: none; color: white;
        }

        .info-btn { background: white; color: var(--primary-color); margin-bottom: 4px; border: 1px solid white; text-align: center; }
        .read-btn { background: var(--accent-color); }
        .secondary-btn { background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.2); }

        .download-links { display: flex; justify-content: space-around; padding-top: 5px; gap: 5px; }
        .dl-icon {
            color: white; font-size: 14px; background: rgba(255, 255, 255, 0.15);

            background: #000; z-index: 9999;
        }

        { id: "", title: "৩৮। মুনাজাতে মাকবুল ও হিজবুল বাহার", telegram: telegramLink, drive: "https://muslimbangla.com/book/6152/%E0%A6%86%E0%A6%B6%E0%A6%B0%E0%A6%BE%E0%A6%AB%20%E0%A6%9A%E0%A6%B0%E0%A6%BF%E0%A6%A4" }
    ];

    const grid = document.getElementById('grid');
    const sidebarList = document.getElementById('sidebar-list');

    function renderLibrary(books) {
        grid.innerHTML = '';
        sidebarList.innerHTML = '';

        if(books.length === 0) {
            grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; font-size: 18px; color: #64748b;">কোনো কিতাব পাওয়া যায়নি!</div>';
            return;
        }

        books.forEach(book => {
            const imgSrc = book.id ? `https://archive.org/services/img/${book.id}` : '';
            const readFunc = book.id 
                ? `openReader('${book.id}', '${book.title.replace(/'/g, "\\'")}')` 
                : `alert('অনলাইনে পড়ার জন্য পিডিএফ রিডারটি এখনও সংযুক্ত করা হয়নি। কিতাবটি পড়তে ডাইরেক্ট ডাউনলোড/ড্রাইভ লিংক ব্যবহার করুন।')`;
            
            const html = `
                <div class="book-card" onclick="toggleActions(this)">
                    <div class="book-cover-wrapper">
                        <span>${book.title}</span>
                        ${book.id ? `<img class="book-image" src="${imgSrc}" alt="${book.title}" loading="lazy" onerror="this.style.display='none';">` : ''}
                    </div>

                    <div class="book-actions">
                        <div class="btn info-btn" onclick="event.stopPropagation();">
                            <i class="fas fa-info-circle"></i> ${book.title}
                        </div>

                        <button class="btn read-btn" onclick="${readFunc}; event.stopPropagation();">
                            <i class="fas fa-book-open"></i> অনলাইনে পড়ুন
                        </button>
                        
                        <a href="../../porichiti/subjects.html" class="btn secondary-btn" onclick="event.stopPropagation();">
                            <i class="fas fa-shield-alt"></i> কিতাবটি সম্পর্কে বিস্তারিত
                        </a>

                        <button class="btn secondary-btn" onclick="alert('শীঘ্রই আসছে'); event.stopPropagation();">
                            <i class="fas fa-pen-fancy"></i> এ লেখকের জীবনী
                        </button>
                        
                        <div class="download-links">
                            <a class="dl-icon" title="আর্কাইভ" href="${book.id ? 'https://archive.org/details/' + book.id : '#'}" target="_blank" onclick="${book.id ? 'event.stopPropagation();' : 'alert(\'আর্কাইভ লিংক শীঘ্রই যুক্ত হবে\'); event.stopPropagation(); return false;'}">
                                <i class="fas fa-archive"></i>
                            </a>
                            <a class="dl-icon" title="ড্রাইভ / ডাউনলোড" href="${book.drive || '#'}" target="_blank" onclick="${book.drive ? 'event.stopPropagation();' : 'alert(\'ড্রাইভ লিংক শীঘ্রই যুক্ত হবে\'); event.stopPropagation(); return false;'}">
                                <i class="fas fa-link"></i>
                            </a>
                            <a class="dl-icon" title="টেলিগ্রাম" href="${book.telegram}" target="_blank" onclick="event.stopPropagation();">
                                <i class="fab fa-telegram"></i>
                            </a>
                        </div>
                    </div>
                </div>
            `;
            grid.innerHTML += html;
            sidebarList.innerHTML += `<div class="sidebar-item" onclick="${readFunc}; toggleSidebar();">${book.title}</div>`;
        });
    }

    renderLibrary(library);

    function filterBooks() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const filtered = library.filter(book => book.title.toLowerCase().includes(query));
        renderLibrary(filtered);
    }

    function toggleActions(card) {
        document.querySelectorAll('.book-card').forEach(c => { if (c !== card) c.classList.remove('active'); });
        card.classList.toggle('active');
    }

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('overlay').style.display = document.getElementById('sidebar').classList.contains('active') ? 'block' : 'none';
    }

    function openReader(id, title) {
        const iframe = document.getElementById('book-iframe');
        iframe.src = `https://archive.org/embed/${id}?ui=full`;
        document.getElementById('reader-title').innerText = title;
        document.getElementById('reader-container').style.display = 'block';
        document.body.style.overflow = 'hidden';
    }

    function closeReader() {
        const iframe = document.getElementById('book-iframe');
        iframe.src = "";
        document.getElementById('reader-container').style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    document.addEventListener('click', (e) => { 
        if (!e.target.closest('.book-card')) {
            document.querySelectorAll('.book-card').forEach(c => c.classList.remove('active'));
        }
    });
</script>
</body>
</html>
