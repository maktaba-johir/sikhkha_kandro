<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجلة الاجماع - আল-ইজমা পত্রিকা লাইব্রেরি</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary-color: #0d9488;
            --primary-dark: #0f766e;
            --accent-color: #f59e0b;
            --bg-color: #f8fafc;
            --text-dark: #1e293b;
        }
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background: var(--bg-color);
            color: var(--text-dark);
            overflow-x: hidden;
        }

        /* Header & Search */
        .header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
            position: relative;
        }
        .menu-btn {
            position: absolute; left: 20px; top: 25px;
            font-size: 24px; cursor: pointer; color: white; z-index: 100;
        }

        .search-box-container {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }
        .search-input {
            width: 100%;
            max-width: 500px;
            padding: 12px 20px;
            font-size: 16px;
            font-family: 'Hind Siliguri', sans-serif;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        .search-input::placeholder { color: rgba(255, 255, 255, 0.7); }
        .search-input:focus {
            background: rgba(255, 255, 255, 0.95);
            color: var(--text-dark);
            border-color: var(--accent-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* Sidebar */
        .sidebar {
            position: fixed; left: -300px; top: 0; width: 300px; height: 100%;
            background: white; box-shadow: 5px 0 15px rgba(0,0,0,0.1);
            transition: 0.3s ease; z-index: 1000; overflow-y: auto; padding: 20px;
        }
        .sidebar.active { left: 0; }
        .sidebar h2 { border-bottom: 2px solid var(--primary-color); margin-bottom: 15px; padding-bottom: 10px; font-size: 18px; }
        .sidebar-item { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 14px; }
        .sidebar-item:hover { background: #f3f4f6; color: var(--primary-color); }

        /* Grid & Cards */
        .container { max-width: 1400px; margin: 0 auto; padding: 30px 15px; }
        .grid-container {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 20px;
        }

        .book-card {
            position: relative; cursor: pointer; border-radius: 12px;
            overflow: hidden; 
            border: 1px solid #cbd5e1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: 0.4s; height: 360px; background: #0f766e;
        }
        .book-card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
            border-color: var(--primary-color); 
        }
        
        /* Cover Wrapper */
        .book-cover-wrapper {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #0d9488, #0f172a);
            color: white; text-align: center; padding: 15px; font-weight: 600; font-size: 16px;
            position: relative;
        }
        .book-image { 
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; object-fit: cover; display: block; 
        }
        
        .book-actions {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(180deg, rgba(13, 148, 136, 0.95) 0%, rgba(15, 118, 110, 1) 100%);
            padding: 12px; transform: translateY(100%);
            transition: 0.4s ease; display: flex; flex-direction: column; gap: 6px;
            max-height: 100%; overflow-y: auto; z-index: 2;
        }
        .book-card.active .book-actions { transform: translateY(0); }

        .btn {
            border: none; padding: 7px; border-radius: 6px;
            cursor: pointer; font-size: 11px; font-weight: 700;
            width: 100%; display: flex; align-items: center; justify-content: center;
            gap: 5px; text-decoration: none; color: white;
        }

        .info-btn { background: white; color: var(--primary-dark); margin-bottom: 4px; border: 1px solid white; text-align: center; }
        .read-btn { background: var(--accent-color); }
        .secondary-btn { background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.2); }

        .download-links { display: flex; justify-content: space-around; padding-top: 5px; gap: 5px; }
        .dl-icon {
            color: white; font-size: 14px; background: rgba(255, 255, 255, 0.15);
            flex: 1; height: 32px; display: flex; align-items: center;
            justify-content: center; border-radius: 5px; text-decoration: none; transition: 0.2s;
        }
        .dl-icon:hover { background: rgba(255, 255, 255, 0.3); }

        /* Reader Popup */
        #reader-container {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
        }
        .close-header {
            background: #1e293b; color: white; padding: 10px 20px;
            display: flex; justify-content: space-between; align-items: center; height: 60px;
        }
        .close-btn { background: #ef4444; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .iframe-wrapper { width: 100%; height: calc(100% - 60px); -webkit-overflow-scrolling: touch; }
        #book-iframe { width: 100%; height: 100%; border: none; }

        .footer { text-align: center; padding: 30px; background: white; margin-top: 50px; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 900; }
    </style>
</head>
<body>

<div class="menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></div>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="sidebar" id="sidebar">

</div>

    </div>
    <div class="iframe-wrapper">
        <iframe id="book-iframe" src="" allowfullscreen webkitallowfullscreen mozallowfullscreen allow="fullscreen"></iframe>
    </div>
</div>

<div class="footer">
    <p>ডেভলপার: <strong>রাহবার টিম</strong></p>
</div>

        { id: "1_20231213_20231213_0311", title: "১৩। مجلة الاجماع", telegram: telegramLink, drive: "https://drive.google.com/file/d/1r8c-ILMrKhUWepXiZPvZbedEAnHAXXEM/view?usp=sharing" },

        { id: "16_20231124_202311", title: "১৬। مجلة الاجماع", telegram: telegramLink, drive: "https://drive.google.com/file/d/1sj9-ekLaHDDHb6SLtmL0RjZOX8BQbRzR/view?usp=sharing" },
        { id: "17_20231124_202311", title: "১৭। مجلة الاجماع", telegram: telegramLink, drive: "https://drive.google.com/file/d/1wmWH84FD_e1bSsUsd_N_q9iwfUJ57yKk/view?usp=sharing" },
        { id: "1_20231213_20231213_0313", title: "১৮। مجلة الاجماع", telegram: telegramLink, drive: "https://drive.google.com/file/d/1W7OrvqOKDccuyqVf0Xf9bor_Ug2A0qry/view?usp=sharing" },
        { id: "Al_Ijma-19", title: "১৯। مجلة الاجماع", telegram: telegramLink, drive: "https://drive.google.com/file/d/1tWjVy9ZNpJsu-_S1nVQDz3ueTkVhbUpZ/view?usp=sharing" },
        { id: "20_20231124_20231124", title: "২০। مجلة الاجماع", telegram: telegramLink, drive: "https://drive.google.com/file/d/1cUTL78HA6FlWq2Y7eNRksRX0XDT8mpKT/view?usp=sharing" },
        { id: "20231220_20231220_1753", title: "২১। مجلة الاجماع", telegram: telegramLink, drive: "https://drive.google.com/file/d/1Fop6Nq8naVOM69ru7_x9v7PN4z6obH8j/view?usp=sharing" },
        { id: "22_20231124", title: "২২। مجلة الاجماع", telegram: telegramLink, drive: "https://drive.google.com/file/d/1xtwRxw9vMZldQ9-tdXhpkonFSd_dTJnF/view?usp=sharing" },
        { id: "23_20231124_20231124", title: "২৩। مجلة الاجماع", telegram: telegramLink, drive: "https://drive.google.com/file/d/16sfBOXNzkM-IaapIvLSjZOy_ZVCyVyzh/view?usp=sharing" },
        { id: "24_20231124", title: "২৪। مجلة الاجماع", telegram: telegramLink, drive: "https://drive.google.com/file/d/1LLDhZHh4ELG7Dq-QNBGQTlY9k1fbz0_n/view?usp=sharing" },
        { id: "20231220_20231220_1756", title: "২৫। مجلة الاجماع", telegram: telegramLink, drive: "https://drive.google.com/file/d/1cLOeRE5d9feeo1yMlTY7_OR-CGccgsSt/view?usp=sharing" },
        { id: "26_20231124", title: "২৬। مجلة الاجماع", telegram: telegramLink, drive: "https://drive.google.com/file/d/1mpVlsgxwITjScyPWqbo8uygW5iuLhJ40/view?usp=sharing" },
        { id: "27_20231124", title: "২৭। مجلة الاجماع", telegram: telegramLink, drive: "https://drive.google.com/file/d/13-AV7ieyBa2V_97dsPSCUpbHsSMSj1Cn/view?usp=sharing" },
        { id: "28_20231124", title: "২৮। مجلة الاجماع", telegram: telegramLink, drive: "https://drive.google.com/file/d/1cd1agyN_vfxXPQXMq29ae7sQFiQu636H/view?usp=sharing" },
        { id: "", title: "২৯। مجلة الاجماع (অপ্রাপ্য)", telegram: telegramLink, drive: "" },
        { id: "", title: "৩০। مجلة الاجماع (অপ্রাপ্য)", telegram: telegramLink, drive: "" }
    ];

    const grid = document.getElementById('grid');
    const sidebarList = document.getElementById('sidebar-list');

    function renderLibrary(books) {
        grid.innerHTML = '';
        sidebarList.innerHTML = '';

        if(books.length === 0) {
            grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; font-size: 18px; color: #64748b;">কোনো সংখ্যা পাওয়া যায়নি!</div>';
            return;
        }

        books.forEach(book => {
            const hasArchive = book.id.trim() !== "";
            const imgSrc = hasArchive ? `https://archive.org/services/img/${book.id}` : '';
            const readFunc = hasArchive ? `openReader('${book.id}', '${book.title.replace(/'/g, "\\'")}')` : `alert('এই পর্বটি বর্তমানে আর্কাইভে অপ্রাপ্য।')`;
            
            const html = `
                <div class="book-card" onclick="toggleActions(this)">
                    <div class="book-cover-wrapper">
                        <span>${book.title}</span>
                        ${hasArchive ? `<img class="book-image" src="${imgSrc}" alt="${book.title}" loading="lazy" onerror="this.style.display='none';">` : ''}
                    </div>

                    <div class="book-actions">
                        <div class="btn info-btn" onclick="event.stopPropagation();">
                            <i class="fas fa-info-circle"></i> ${book.title}
                        </div>

                        <button class="btn read-btn" onclick="${readFunc}; event.stopPropagation();">
                            <i class="fas fa-book-open"></i> অনলাইনে পড়ুন
                        </button>

                        <div class="download-links">
                            <a class="dl-icon" title="আর্কাইভ" href="${hasArchive ? 'https://archive.org/details/' + book.id : '#'}" ${hasArchive ? 'target="_blank"' : ''} onclick="${hasArchive ? 'event.stopPropagation();' : 'alert(\'আর্কাইভ লিংক নেই\'); event.stopPropagation(); return false;'}">
                                <i class="fas fa-archive"></i>
                            </a>
                            <a class="dl-icon" title="গুগল ড্রাইভ" href="${book.drive || '#'}" ${book.drive ? 'target="_blank"' : ''} onclick="${book.drive ? 'event.stopPropagation();' : 'alert(\'গুগল ড্রাইভ লিংক শীঘ্রই যুক্ত করা হবে\'); event.stopPropagation(); return false;'}">
                                <i class="fab fa-google-drive"></i>
                            </a>
                            <a class="dl-icon" title="টেলিগ্রাম" href="${book.telegram}" target="_blank" onclick="event.stopPropagation();">
                                <i class="fab fa-telegram"></i>
                            </a>
                        </div>
                    </div>
                </div>
            `;
            grid.innerHTML += html;
            sidebarList.innerHTML += `<div class="sidebar-item" onclick="${readFunc}; toggleSidebar();">${book.title}</div>`;
        });
    }

    renderLibrary(library);

    function filterBooks() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const filtered = library.filter(book => book.title.toLowerCase().includes(query));
        renderLibrary(filtered);
    }

    function toggleActions(card) {
        document.querySelectorAll('.book-card').forEach(c => { if (c !== card) c.classList.remove('active'); });
        card.classList.toggle('active');
    }

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('overlay').style.display = document.getElementById('sidebar').classList.contains('active') ? 'block' : 'none';
    }

    function openReader(id, title) {
        const iframe = document.getElementById('book-iframe');
        iframe.src = `https://archive.org/embed/${id}?ui=full`;
        document.getElementById('reader-title').innerText = title;
        document.getElementById('reader-container').style.display = 'block';
        document.body.style.overflow = 'hidden';
    }

    function closeReader() {
        const iframe = document.getElementById('book-iframe');
        iframe.src = "";
        document.getElementById('reader-container').style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    document.addEventListener('click', (e) => { 
        if (!e.target.closest('.book-card')) {
            document.querySelectorAll('.book-card').forEach(c => c.classList.remove('active'));
        }
    });
</script>

</html>
