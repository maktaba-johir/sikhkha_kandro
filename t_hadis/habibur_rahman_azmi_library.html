function renderLibrary(books){grid.innerHTML='';sidebarList.innerHTML='';if(!books.length){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;font-size:18px;color:#64748b">কোনো কিতাব পাওয়া যায়নি!</div>';return}books.forEach(book=>{const img='https://archive.org/services/img/'+book.id;const title=JSON.stringify(book.title);grid.insertAdjacentHTML('beforeend',`<div class="book-card" onclick="toggleActions(this)"><div class="book-cover-wrapper"><span>${escapeHtml(book.title)}</span><img class="book-image" src="${img}" alt="${escapeHtml(book.title)}" loading="lazy" onerror="this.style.display='none'"></div><div class="book-actions"><div class="btn info-btn" onclick="event.stopPropagation()"><i class="fas fa-info-circle"></i> ${escapeHtml(book.title)}</div><button class="btn read-btn" onclick='openReader(${JSON.stringify(book.id)},${title});event.stopPropagation()'><i class="fas fa-book-open"></i> অনলাইনে পড়ুন</button><a href="../../porichiti/subjects.html" class="btn secondary-btn" onclick="event.stopPropagation()"><i class="fas fa-shield-alt"></i> কিতাবটি সম্পর্কে বিস্তারিত</a><button class="btn secondary-btn" onclick="alert('শীঘ্রই আসছে');event.stopPropagation()"><i class="fas fa-pen-fancy"></i> এ লেখকের জীবনী</button><div class="download-links"><a class="dl-icon" title="আর্কাইভ" href="https://archive.org/details/${book.id}" target="_blank" onclick="event.stopPropagation()"><i class="fas fa-archive"></i></a><a class="dl-icon" title="গুগল ড্রাইভ" href="${book.drive}" target="_blank" onclick="event.stopPropagation()"><i class="fab fa-google-drive"></i></a><a class="dl-icon" title="টেলিগ্রাম" href="${book.telegram}" target="_blank" onclick="event.stopPropagation()"><i class="fab fa-telegram"></i></a></div></div></div>`);sidebarList.insertAdjacentHTML('beforeend',`<div class="sidebar-item" onclick='openReader(${JSON.stringify(book.id)},${title});toggleSidebar()'>${escapeHtml(book.title)}</div>`)});}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function filterBooks(){const q=document.getElementById('searchInput').value.toLowerCase().trim();renderLibrary(library.filter(b=>b.title.toLowerCase().includes(q)))}function toggleActions(card){document.querySelectorAll('.book-card').forEach(c=>{if(c!==card)c.classList.remove('active')});card.classList.toggle('active')}function toggleSidebar(){const s=document.getElementById('sidebar');s.classList.toggle('active');document.getElementById('overlay').style.display=s.classList.contains('active')?'block':'none'}function openReader(id,title){document.getElementById('book-iframe').src='https://archive.org/embed/'+id+'?ui=full';document.getElementById('reader-title').innerText=title;document.getElementById('reader-container').style.display='block';document.body.style.overflow='hidden'}function closeReader(){document.getElementById('book-iframe').src='';document.getElementById('reader-container').style.display='none';document.body.style.overflow='auto'}document.addEventListener('click',e=>{if(!e.target.closest('.book-card'))document.querySelectorAll('.book-card').forEach(c=>c.classList.remove('active'))});renderLibrary(library);
