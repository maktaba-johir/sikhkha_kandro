    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary-color: #065f46; 
            --primary-dark: #064e3b;
            --accent-color: #f59e0b;
            --bg-color: #f0fdf4;
        }
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background: var(--bg-color);
            overflow-x: hidden;
        }

        /* হেডার */
        .header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
            position: relative;
        }
        .back-btn {
            position: absolute; left: 20px; top: 20px;
            color: white; text-decoration: none; font-size: 18px;
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 30px 15px; }
        .grid-container {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px;
        }

        /* কিতাব কার্ড এনিমেশন */
        .book-card {
            position: relative; cursor: pointer; border-radius: 12px;
            overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: 0.4s; height: 380px; background: white;
        }
        .book-image { width: 100%; height: 100%; object-fit: cover; }
        
        .book-actions {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(180deg, rgba(6, 95, 70, 0.98) 0%, rgba(6, 78, 59, 1) 100%);
            padding: 15px 10px; transform: translateY(100%);
            transition: 0.4s ease; display: flex; flex-direction: column; gap: 8px;
            max-height: 100%; overflow-y: auto; color: white;
        }
        .book-card.active .book-actions { transform: translateY(0); }

        .book-title { font-size: 14px; font-weight: 700; color: #fcc201; margin-bottom: 2px; text-align: center;}
        .book-author { font-size: 11px; opacity: 0.9; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 5px; }
        .book-feature { font-size: 10px; margin: 5px 0; line-height: 1.3; }

        .btn {
            border: none; padding: 8px; border-radius: 6px;
            cursor: pointer; font-size: 11px; font-weight: 700;
            width: 100%; display: flex; align-items: center; justify-content: center;
            gap: 5px; text-decoration: none; color: white;
        }
        .read-btn { background: var(--accent-color); color: #000; }

        .download-links { display: flex; justify-content: space-around; gap: 5px; margin-top: 5px; }
        .dl-icon {
            color: white; font-size: 16px; background: rgba(255, 255, 255, 0.15);
            flex: 1; height: 35px; display: flex; align-items: center;
            justify-content: center; border-radius: 5px; text-decoration: none;
        }

        /* রিডার পপআপ */
        #reader-container {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
        }
        .close-header {
            background: #1e293b; color: white; padding: 10px 20px;
            display: flex; justify-content: space-between; align-items: center; height: 60px;
        }
        .close-btn { background: #ef4444; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }

        @media (max-width: 480px) {
            .grid-container { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
            .book-card { height: 320px; }
        }
    </style>

    ];

    const grid = document.getElementById('grid');

    function renderBooks() {
        books.forEach(book => {
            const html = `
                <div class="book-card" onclick="toggleActions(this)">
                    <img class="book-image" src="https://archive.org/services/img/${book.id}">
                    <div class="book-actions">
                        <div class="book-title">${book.title}</div>
                        <div class="book-author">লেখক: ${book.author}</div>
                        <div class="book-feature"><b>বৈশিষ্ট্য:</b> ${book.feature}</div>

                        <button class="btn read-btn" onclick="openReader('${book.id}', '${book.title}'); event.stopPropagation();">
                            <i class="fas fa-book-open"></i> অনলাইনে পড়ুন
                        </button>
                        
                        <div class="download-links">
                            <a class="dl-icon" title="আর্কাইভ" href="https://archive.org/download/${book.id}" target="_blank" onclick="event.stopPropagation();">
                                <i class="fas fa-archive"></i>
                            </a>
                            <a class="dl-icon" title="গুগল ড্রাইভ" onclick="alert('ড্রাইভ লিঙ্ক নেই'); event.stopPropagation();">
                                <i class="fab fa-google-drive"></i>
                            </a>
                            <a class="dl-icon" title="টেলিগ্রাম" href="${telegramLink}" target="_blank" onclick="event.stopPropagation();">
                                <i class="fab fa-telegram"></i>
                            </a>
                        </div>
                    </div>
                </div>
            `;
            grid.innerHTML += html;
        });
    }

    function toggleActions(card) {
        document.querySelectorAll('.book-card').forEach(c => { if (c !== card) c.classList.remove('active'); });
        card.classList.toggle('active');
    }

    function openReader(id, title) {
        document.getElementById('book-iframe').src = `https://archive.org/embed/${id}?ui=full`;
        document.getElementById('reader-title').innerText = title;
        document.getElementById('reader-container').style.display = 'block';
        document.body.style.overflow = 'hidden';
    }

    function closeReader() {
        document.getElementById('book-iframe').src = "";
        document.getElementById('reader-container').style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    document.addEventListener('click', (e) => { 
        if (!e.target.closest('.book-card')) {
            document.querySelectorAll('.book-card').forEach(c => c.classList.remove('active'));
        }
    });

    renderBooks();
</script>
